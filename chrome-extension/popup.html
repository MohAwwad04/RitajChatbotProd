<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Ritaj Assistant</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <header id="header">
      <div class="brand">
        <img src="icons/icon32.png" alt="" width="26" height="26" />
        <div class="brand__text">
          <strong id="title">Ritaj Assistant</strong>
          <small id="subtitle">Birzeit University</small>
        </div>
      </div>
      <div class="actions">
        <button id="lang-toggle" title="العربية / English">ع</button>
        <button id="open-portal" title="Open the full portal">⧉</button>
        <button id="new-chat" title="New chat">↺</button>
      </div>
    </header>

    <main id="thread" aria-live="polite"></main>

    <div id="suggestions"></div>

    <form id="composer">
      <input id="input" type="text" autocomplete="off" placeholder="Ask about Ritaj or Birzeit…" />
      <button id="send" type="submit" disabled>➤</button>
    </form>
  </div>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>

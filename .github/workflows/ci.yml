name: CI

# Regression gate (PLAN §13). Runs the model-free smoke tests on every push and
# pull request — the cheap quality gate that needs no GPU, no LLM, and no network
# model downloads. The full golden-set eval (one LLM call per case) is too heavy
# for CI; run it locally with `python scripts/eval_golden.py` before a release.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # CPU-only torch keeps the install light (sentence-transformers pulls it
        # in, but the smoke tests never actually load a model).
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run model-free smoke tests
        run: pytest -q

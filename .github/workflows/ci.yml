name: CI

# The release gate (roadmap Phase 9.2). Everything here is model-free and
# network-free so it runs on every pull request in a couple of minutes — a gate
# that takes twenty minutes gets bypassed, and a bypassed gate is not a gate.
# The heavy evaluation (one LLM call per case) runs before a release, not on
# every push.

on:
  push:
    # Working branches are covered by the pull_request trigger below; these two
    # are the long-lived ones where a direct push still has to be gated.
    branches: [main, release]
  pull_request:
  # On demand. The release process needs to re-run the gates against a tag
  # without pushing a commit, and it makes "is CI actually wired up?" a question
  # with an answer rather than a guess.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # CPU-only torch keeps the install light (sentence-transformers pulls it
        # in, but nothing here loads a model).
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit + integration tests
        env:
          STARTUP_INIT: "0"
          ENVIRONMENT: development
        run: pytest -q

  policy:
    name: Corpus, navigation, privacy and extension policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Every indexed record traces to an approved ritaj.birzeit.edu URL, and no
      # indexable file has appeared outside the manifest's control.
      - name: Corpus source policy
        # NOT --release here. The release form fails when the check has
        # nothing to validate, which is the correct state of this branch
        # today; blocking every pull request on it would teach the team to
        # ignore a red job. HANDBOOK.md §6 runs --release, and
        # that is where it blocks.
        run: python scripts/check_corpus_policy.py

      # Destinations are reviewed Ritaj URLs; 18 known URL attacks are rejected.
      - name: Navigation registry
        run: python scripts/check_navigation.py

      # Minimal permissions, and navigation.js's allowlist matches the registry.
      - name: Extension manifest and allowlist
        run: python scripts/check_extension.py

      # The privacy documents match the manifest, the portal and the prompt.
      - name: Privacy disclosures
        run: python scripts/check_privacy.py

      # A public error code with no wording in a client is not a crash — it is
      # the client confidently telling a student something untrue about why the
      # product did not work. Both clients, both languages.
      - name: Error message coverage
        run: python scripts/check_error_messages.py

      # Advisory for the same reason the completeness gate is: it fails on
      # missing *people*, not missing code, and blocking every pull request on
      # an unassigned duty teaches the team to ignore a red job. It is listed as
      # blocking in HANDBOOK.md §6 E — nothing ships with an
      # unowned duty or an unrehearsed rollback.
      - name: Operational ownership register (advisory)
        continue-on-error: true
        run: python scripts/check_operations.py

      # Scope refusals, injection redaction and URL rejection: model-free and
      # blocking, because these are safety properties, not coverage targets.
      - name: Model-free release checks
        run: python scripts/eval_release.py

      # Advisory until an approved corpus exists: the answerable/calendar/
      # navigation categories cannot be written against a corpus that does not
      # exist, and blocking every PR on that helps nobody. Flip to blocking (drop
      # continue-on-error) as part of the release checklist.
      - name: Release-set completeness (advisory)
        continue-on-error: true
        run: python scripts/eval_release.py --gate

  security:
    name: Secrets and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pip-audit

      # The dependency lock is what the container installs from. If it drifts
      # from pyproject.toml, the image ships something nobody reviewed.
      - name: Dependency lock is current
        run: |
          pipx install uv 2>/dev/null || pip install uv
          python scripts/lock_deps.py --check

      - name: Committed-secret scan
        run: python scripts/secret_inventory.py --scan-only

      # Blocking, and BEFORE the regenerating step below: --check-current
      # compares the committed release/sbom.json against the tree, and running
      # `sbom.py` first would overwrite the very file under test. The committed
      # copy once named pypdf 6.13.3 while the lock shipped 6.14.2, and nothing
      # noticed for five days because CI only ever regenerated and uploaded it.
      - name: Committed SBOM matches the tree
        run: python scripts/sbom.py --check-current

      - name: Software bill of materials
        run: python scripts/sbom.py

      - name: Reproducibility (digest-pinned base, hashed dependencies)
        run: python scripts/sbom.py --check-pinned

      # Audits the locked runtime set — the packages that actually ship —
      # rather than whatever happens to be in the CI environment.
      #
      # Advisory: a CVE published today is not the fault of whoever opens the
      # next pull request, and blocking their merge on it teaches people to
      # ignore the job. It is reviewed at release time, where the checklist
      # makes it blocking.
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: pip-audit -r requirements.lock.txt --desc

      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: release/sbom.json

  frontend:
    name: Portal build and extension tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ritaj-student-portal/package-lock.json
      # This job also runs the packaging and scan scripts, which are Python.
      # Without this, `python` may not be on PATH at all.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install portal dependencies
        working-directory: ritaj-student-portal
        run: npm ci

      # `npm run lint` existed and was cited as a gate, but there was no ESLint 9
      # flat config, so it exited non-zero on startup and had never checked
      # anything. It runs before the build because a lint error is cheaper to
      # read than a bundler failure.
      - name: Lint portal
        working-directory: ritaj-student-portal
        run: npm run lint

      # tsc runs as part of the build, so a type error fails here.
      - name: Build portal
        working-directory: ritaj-student-portal
        run: npm run build

      # The client-side destination validator is a deliberate second
      # implementation of the URL policy, so it carries its own tests.
      - name: Extension validator tests
        run: >
          node --test
          chrome-extension/navigation.test.mjs
          chrome-extension/links.test.mjs
          chrome-extension/transport.test.mjs

      - name: Build the extension package
        run: python scripts/package_extension.py --verify

      # Scans the built ZIP as well as tracked files — a local config swept in
      # by a careless archive command ships to every user.
      - name: Scan the packaged extension
        run: python scripts/secret_inventory.py --scan-only

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      # Real Chromium, unpacked extension. Headed under xvfb: old headless
      # Chromium does not run MV3 extension service workers at all, so a
      # headless run reports a working extension as broken.
      #
      # Tested against the PACKAGED artifact, not the source directory, so the
      # thing verified is the thing submitted.
      - name: Extension E2E in Chromium
        run: |
          mkdir -p /tmp/ext-pkg
          unzip -q ritaj-assistant-extension.zip -d /tmp/ext-pkg
          xvfb-run -a node scripts/e2e_extension.mjs /tmp/ext-pkg

  load:
    name: Load and resilience
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Concurrency cap, queue timeout, both rate-limit buckets, the daily
      # budget, provider failure and a memory soak — against a stubbed provider,
      # so it costs no quota. This is what found that the streaming route had
      # no concurrency cap at all.
      - name: Load scenarios
        run: python scripts/loadtest.py --json load-results.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: load-results
          path: load-results.json

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The image bakes ~2 GB of model weights, so it is not built on every pull
    # request. It IS built on pushes to the long-lived branches and on demand —
    # a release candidate must be able to verify the container without first
    # merging it, which is the only point at which the Dockerfile's hashed
    # install and digest-pinned base are exercised for real.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7

      # The Dockerfile COPYs ritaj-student-portal/dist, which is a build output
      # and therefore gitignored — a fresh checkout does not have it, and the
      # build fails at that COPY. scripts/deploy_space.py guards the same
      # requirement with an explicit "build the portal first" error.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ritaj-student-portal/package-lock.json
      - name: Build the portal the image serves
        working-directory: ritaj-student-portal
        run: npm ci && npm run build

      - name: Build image
        run: docker build -t ritaj-assistant:ci .

      - name: Container binds the port before it is ready
        # This is the regression test for the outage: /live must answer long
        # before initialization finishes. If this step ever needs a longer wait,
        # something has moved back in front of the port bind.
        run: |
          docker run -d --name ritaj-ci -p 7860:7860 \
            -e ALLOW_INDEX_BUILD_ON_BOOT=0 \
            -e ENVIRONMENT=development \
            ritaj-assistant:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:7860/live >/dev/null; then break; fi
            sleep 2
          done
          echo "live:"  && curl -fsS http://localhost:7860/live
          echo "ready:" && curl -sS -o /dev/null -w '%{http_code}\n' http://localhost:7860/ready
          docker logs ritaj-ci | tail -30
          docker rm -f ritaj-ci

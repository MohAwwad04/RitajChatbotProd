# Curated link map: knowledge-base doc -> the Ritaj/Birzeit page(s) it describes.
#
# Keyed by the doc filename that appears in chunk metadata as `source` (see
# ingest.build_index, which sets meta["source"] = path.name). This file is NOT
# indexed: it lives outside data/raw/ so it never affects retrieval — it is only
# consulted AFTER an answer is generated, to attach the verified URL of a cited
# doc deterministically (the LLM never emits links; links.py looks them up here).
#
# Schema, per doc:
#   <filename>.md:
#     - label: "Human-readable page name"
#       url: "https://ritaj.birzeit.edu/..."   # must be a real, on-site URL
#       path: "/..."                            # optional, the path portion
#       verified: false                         # true ONLY for a confirmed URL
# A doc with no usable URL maps to an empty list ([]).
#
# URL reality: many student pages (schedule, grades, financial account, personal
# info, webmail) sit BEHIND the Ritaj login and have no verifiable deep link.
# Those use a safe public fallback (the portal home, or the relevant public
# birzeit.edu page) with verified: false and a `# TODO verify` marker. Every
# verified: false entry is also listed in data/links_TODO.md for a human to
# confirm. Never guess a path and mark it verified.

